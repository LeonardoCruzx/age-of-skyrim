name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Ferramenta + scripts do vcpkg (tag 2026.07.29). As VERSÕES das libs continuam fixadas pelo
  # builtin-baseline do vcpkg.json; o checkout antigo do baseline não serve mais (mirrors do MSYS2 dão 404).
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  # Cache binário do vcpkg em disco (backend "files"), persistido com actions/cache.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build:
    # Fixo no 2022: o preset usa o gerador "Visual Studio 17 2022", ausente nas imagens mais novas.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Criar pasta do cache binário
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache do vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_COMMIT_ID }}-

      # vcpkg clonado à mão em VCPKG_COMMIT_ID (sem lukka/run-vcpkg, que força o backend x-gha).
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}/vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout --quiet $env:VCPKG_COMMIT_ID
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_DEFAULT_BINARY_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset release

      # Expõe o fim dos logs do vcpkg/CMake como anotações (visíveis sem login, na aba Summary).
      - name: Diagnóstico de falha
        if: failure()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem -Path build -Recurse -Include vcpkg-manifest-install.log, CMakeError.log -ErrorAction SilentlyContinue)
          $logs += Get-ChildItem -Path "$env:VCPKG_ROOT/buildtrees" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -match 'out|err|config|build' } | Sort-Object LastWriteTime -Descending | Select-Object -First 6
          foreach ($f in $logs) {
            $tail = (Get-Content $f.FullName -Tail 60) -join '%0A'
            Write-Output "::error title=$($f.Name)::$tail"
          }

      - name: Montar pacote do mod
        shell: pwsh
        run: |
          $stage = "package"
          New-Item -ItemType Directory -Force -Path "$stage/SKSE/Plugins" | Out-Null
          Copy-Item -Recurse -Force data/* $stage
          Copy-Item build/Release/AgeOfSkyrim.dll "$stage/SKSE/Plugins/"
          Copy-Item build/Release/AgeOfSkyrim.pdb "$stage/SKSE/Plugins/" -ErrorAction SilentlyContinue

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: AgeOfSkyrim-${{ github.sha }}
          path: package/
          if-no-files-found: error
