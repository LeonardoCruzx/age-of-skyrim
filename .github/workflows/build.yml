name: Build

on:
  push:
    branches: [ main, "m*-*" ]  # main + branches de missão (ex.: m4-territorios)
  pull_request:
  workflow_dispatch:

env:
  # Ferramenta + scripts do vcpkg (tag 2026.07.29). As VERSÕES das libs continuam fixadas pelo
  # builtin-baseline do vcpkg.json; o checkout antigo do baseline não serve mais (mirrors do MSYS2 dão 404).
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  # Cache binário do vcpkg em disco (backend "files"), persistido com actions/cache.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
  # Compilador Papyrus open source (MIT), fora do Creation Kit (ADR 0035). Versão e hash fixos.
  CAPRICA_URL: https://github.com/Orvid/Caprica/releases/download/v0.3.0/Caprica.v0.3.0.7z
  CAPRICA_SHA256: 0037E54CF3A1021E976278D9A637E8AE541AAF9EBEB8D274B6C2CFE32F4EE559

jobs:
  build:
    # Fixo no 2022: o preset usa o gerador "Visual Studio 17 2022", ausente nas imagens mais novas.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CommonLibSSE-NG (pin atual) classifica como "SE" qualquer runtime.exe cuja minor version não seja
      # 4 (VR) ou 6 (AE) — quebra em versões do jogo >= 1.7.x (ADR 0064). Até o upstream corrigir, aplicamos
      # o fix aqui; "patch --check" já valida que ainda se aplica de forma limpa (senão falha cedo e visível).
      - name: Patch do CommonLibSSE-NG (detecção de runtime AE + fallback de formato do address library)
        run: |
          git apply --check tools/vendor-patches/commonlibsse-ng-ae-version-detect.patch --directory=extern/CommonLibSSE-NG
          git apply tools/vendor-patches/commonlibsse-ng-ae-version-detect.patch --directory=extern/CommonLibSSE-NG
          git apply --check tools/vendor-patches/commonlibsse-ng-ae-address-library-format-fallback.patch --directory=extern/CommonLibSSE-NG
          git apply tools/vendor-patches/commonlibsse-ng-ae-address-library-format-fallback.patch --directory=extern/CommonLibSSE-NG

      - name: Conferir traduções (en / pt-br + chaves usadas no Papyrus)
        run: python tools/check_translations.py

      - name: Testes Python (ESP gerado)
        run: python -m unittest discover -s tests -v

      # Antes do build C++ (que é lento): erro de script aparece em segundos.
      # Stubs próprios em tools/papyrus/stubs (só declarações; scripts vanilla/SkyUI não são redistribuídos).
      - name: Compilar scripts Papyrus (Caprica)
        shell: pwsh
        run: |
          $dir = "build/caprica"
          New-Item -ItemType Directory -Force -Path $dir, build/pex | Out-Null
          Invoke-WebRequest -Uri $env:CAPRICA_URL -OutFile "$dir/caprica.7z"
          $hash = (Get-FileHash "$dir/caprica.7z" -Algorithm SHA256).Hash
          if ($hash -ne $env:CAPRICA_SHA256) {
            Write-Output "::error title=Caprica::hash inesperado do download: $hash"
            exit 1
          }
          7z x "$dir/caprica.7z" "-o$dir/bin" -y | Out-Null
          $exe = Get-ChildItem -Path "$dir/bin" -Recurse -Filter Caprica.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Output "::error title=Caprica::Caprica.exe não encontrado no pacote"
            Get-ChildItem -Recurse "$dir/bin" | ForEach-Object { Write-Output $_.FullName }
            exit 1
          }
          # Caprica tira o "namespace" do caminho relativo ao diretório atual: no Skyrim não pode haver nenhum,
          # então roda de dentro da pasta dos fontes e recebe só os nomes dos arquivos.
          $root = (Get-Location).Path
          $scripts = Get-ChildItem data/Scripts/Source -Filter *.psc | ForEach-Object { $_.Name }
          Push-Location data/Scripts/Source
          $out = & $exe.FullName --game skyrim --flags "$root/tools/papyrus/AgeOfSkyrim_Flags.flg" `
                   --import "$root/tools/papyrus/stubs" --output "$root/build/pex" @scripts 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $out | ForEach-Object { Write-Output "$_" }
          $pex = @(Get-ChildItem build/pex -Filter *.pex)
          if ($code -ne 0 -or $pex.Count -ne $scripts.Count) {
            $msg = ($out | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=Papyrus (Caprica) codigo $code - $($pex.Count) de $($scripts.Count) pex::$msg"
            exit 1
          }
          $pex | ForEach-Object { Write-Output "OK: $($_.Name) ($($_.Length) bytes)" }

      - name: Criar pasta do cache binário
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache do vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_COMMIT_ID }}-

      # vcpkg clonado à mão em VCPKG_COMMIT_ID (sem lukka/run-vcpkg, que força o backend x-gha).
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}/vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout --quiet $env:VCPKG_COMMIT_ID
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_DEFAULT_BINARY_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-msvc

      # Erros do compilador viram anotações (visíveis sem login, na aba Summary).
      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset release 2>&1 | Tee-Object -FilePath build/build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build/build.log -Pattern 'error C\d+|error LNK\d+|fatal error' |
              Select-Object -First 30 | ForEach-Object { Write-Output "::error title=MSVC::$($_.Line.Trim())" }
            exit $code
          }

      # Expõe o fim dos logs do vcpkg/CMake como anotações (visíveis sem login, na aba Summary).
      - name: Diagnóstico de falha
        if: failure()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem -Path build -Recurse -Include vcpkg-manifest-install.log, CMakeError.log -ErrorAction SilentlyContinue)
          $logs += Get-ChildItem -Path "$env:VCPKG_ROOT/buildtrees" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -match 'out|err|config|build' } | Sort-Object LastWriteTime -Descending | Select-Object -First 6
          foreach ($f in $logs) {
            $tail = (Get-Content $f.FullName -Tail 60) -join '%0A'
            Write-Output "::error title=$($f.Name)::$tail"
          }

      - name: Montar pacote do mod
        shell: pwsh
        run: |
          $stage = "package"
          New-Item -ItemType Directory -Force -Path "$stage/SKSE/Plugins" | Out-Null
          Copy-Item -Recurse -Force data/* $stage
          Copy-Item build/Release/AgeOfSkyrim.dll "$stage/SKSE/Plugins/"
          Copy-Item build/Release/AgeOfSkyrim.pdb "$stage/SKSE/Plugins/" -ErrorAction SilentlyContinue
          # Papyrus compilado, plugin do MCM (ESL) e traduções do SkyUI — todos gerados aqui, nada binário no git.
          Copy-Item build/pex/*.pex "$stage/Scripts/"
          python tools/build_esp.py "$stage/AgeOfSkyrim.esp"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/gen_skyui_translations.py "$stage/Interface/Translations"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse $stage | ForEach-Object { Write-Output $_.FullName.Substring((Resolve-Path $stage).Path.Length) }

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: AgeOfSkyrim-${{ github.sha }}
          path: package/
          if-no-files-found: error
