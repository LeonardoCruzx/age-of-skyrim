name: age-of-skyrim

services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: age-of-skyrim-dev
    working_dir: /workspaces/AgeOfSkyrim
    user: vscode
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      # Login/config do Claude ficam só no volume abaixo (isolado da conta de trabalho no host).
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    volumes:
      - .:/workspaces/AgeOfSkyrim:cached
      - claude-config:/home/vscode/.claude
      # Logs/cosave do SKSE (Documents\My Games\Skyrim Special Edition\SKSE no Windows) — só leitura,
      # pra eu ler AgeOfSkyrim.log/AgeOfSkyrim_territories.json direto, sem você precisar colar no chat.
      # Ajuste "source" se o caminho for diferente no seu Windows (usuário/OneDrive).
      - type: bind
        source: 'C:\Users\leosi\OneDrive\Documentos\My Games\Skyrim Special Edition\SKSE'
        target: /workspaces/skyrim-logs
        read_only: true

volumes:
  claude-config:
    name: aos-claude-config
